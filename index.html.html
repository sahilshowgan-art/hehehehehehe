<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Adventure 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5d8f;--soft:#fff0f5;--ink:#4a2038}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(#4f9a9c 0%,#78aaa0 50%,#aebfae 100%);font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);touch-action:none}
canvas{display:block}
body::before{display:none;content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.16;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 55%,rgba(20,10,30,.38) 100%)}
#hud{z-index:2;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:rgba(255,255,255,.92);padding:8px 14px;border-radius:99px;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
#prompt{z-index:2;position:fixed;bottom:150px;left:50%;transform:translateX(-50%);display:none}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:11px 20px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 4px 0 #c93a69;margin:4px}
button.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e2c3d1}
#dlg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(560px,94vw);background:var(--soft);border:3px solid var(--pink);border-radius:22px;padding:16px 18px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:5;touch-action:auto}
#dlg h3{margin:0 0 6px;font-family:'Pacifico',cursive;color:var(--pink);font-weight:400;font-size:20px}
#dlg p{margin:0 0 10px;font-size:17px;line-height:1.4}
#dlg input{font:inherit;padding:9px;border-radius:10px;border:2px solid var(--pink);margin:4px}
#pad{z-index:2;position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
#pad button{margin:0;padding:0;width:52px;height:52px;font-size:20px;opacity:.85}
@media(hover:hover) and (pointer:fine){#pad{display:none}}
#intro{position:fixed;inset:0;background:linear-gradient(#e8b5c8,#f4d3df);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;padding:20px}
#intro h1{font-family:'Pacifico',cursive;color:var(--pink);font-weight:400;font-size:clamp(30px,8vw,52px);margin:0 0 10px}
.heart{position:fixed;bottom:-30px;font-size:28px;pointer-events:none;animation:up 3.5s linear forwards;z-index:20}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<div id="intro"><div style="font-size:60px">🌍💌</div><h1 id="introTitle"></h1><p style="max-width:430px;font-size:18px">I made a tiny planet just for you. Follow the pink arrow, answer the gates, and find me on the other side of the world.</p><button id="start">Start ✨</button><p style="font-size:13px;opacity:.7">W / ↑ walk · S / ↓ back · A D / ← → turn · Talk: E or Space · Drag = rotate camera 360° · Scroll = zoom · F = see her face 🖱️ · Click photo boards 📸</p></div>
<div id="hud"><div class="pill" id="dist"></div><div class="pill" id="gates"></div></div>
<button id="prompt"></button><div id="dlg"></div>
<button id="mus" title="Music" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:10px;margin:0;padding:8px 12px;z-index:6">🎵</button>
<div id="pad"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>

 const faceView=()=>{const TP=Math.PI*2;if(Math.cos(camYaw)>0)camYaw=Math.round((camYaw-Math.PI)/TP)*TP+Math.PI;else camYaw=Math.round(camYaw/TP)*TP;camPitch=.2;camDist=Math.min(camDist,8)};
 const vb=document.createElement('button');vb.textContent='👁 face';vb.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px) + 196px);right:10px;margin:0;padding:8px 12px;font-size:12px;z-index:6';vb.onclick=faceView;document.body.appendChild(vb);
 addEventListener('keydown',e=>{if(dlgOpen||e.repeat)return;if(e.key==='f'||e.key==='F')faceView();if(e.key==='r'||e.key==='R'){camYaw=Math.round(camYaw/(Math.PI*2))*Math.PI*2;camPitch=.35;camDist=9}})}

// loop
const clock=new THREE.Clock();let walk=0;const camPos=new V3().copy(A).multiplyScalar(R+9).addScaledVector(fwd,-11);cam.position.copy(camPos);cam.up.copy(up);
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),T=clock.elapsedTime;
 let f=0,tr=0;if(started&&!dlgOpen){if(keys.w||keys.arrowup||keys.padup)f++;if(keys.s||keys.arrowdown||keys.paddown)f--;if(keys.a||keys.arrowleft||keys.padleft)tr++;if(keys.d||keys.arrowright||keys.padright)tr--}
 if(tr)fwd.applyAxisAngle(up,tr*2.2*dt);
 if(f){const th=f*6.5*dt/R,ax=new V3().crossVectors(up,fwd).normalize();up.applyAxisAngle(ax,th);fwd.applyAxisAngle(ax,th);up.normalize();fwd.copy(tan(up,fwd));walk+=dt*12}
 const sw=f?Math.sin(walk)*.6:0,u=player.userData;u.lL.rotation.x=sw;u.lR.rotation.x=-sw;u.aL.rotation.x=-sw*.8;u.aR.rotation.x=sw*.8;
 collide();const pp=up.clone().multiplyScalar(R);player.position.copy(pp);orient(player,up,fwd);
 rig.rotation.y+=dt*.015;hg.rotation.y=T;updateLife(dt,T);updateEnv(pp,dt,T);updateMap(pp);adapt(dt);heart.position.y=Math.sin(T*2)*.3;
 // target + arrow
 const tg=gates.find(g=>!g.done),tv=tg?tg.v:B;arrow.position.copy(pp).addScaledVector(up,4.6+Math.sin(T*3)*.25);orient(arrow,up,tan(up,tv));
 const d=Math.acos(Math.min(1,up.dot(B)))*R;$('dist').textContent=`💙 ${CONFIG.you} is ${Math.round(d)} m away`;$('gates').textContent=`❓ Gates ${gDone()}/${gates.length}`;
 near=null;let best=4.2;npcs.forEach(n=>{const e=n.g.position.distanceTo(pp);if(e<best){best=e;near=n}});
 if(started&&!dlgOpen){const g=gates.find(g=>!g.done&&g.pos.distanceTo(pp)<4.2);if(g)gate(g,gates.indexOf(g))}
 const p=$('prompt');if(near&&!dlgOpen&&started){p.style.display='block';p.textContent=`💬 Talk to ${near.name.split(' ')[0]} (E)`}else p.style.display='none';
 const ke=Math.min(1,dt*10);ey+=(camYaw-ey)*ke;ep+=(camPitch-ep)*ke;ed+=(camDist-ed)*ke;const fr=fwd.clone().applyAxisAngle(up,ey);cam.position.copy(pp).addScaledVector(up,2.4+ed*Math.sin(ep)).addScaledVector(fr,-ed*Math.cos(ep));cam.up.lerp(up,.12).normalize();cam.lookAt(pp.clone().addScaledVector(up,3).addScaledVector(fr,5));
 renderFX()}
loop();
</script>
